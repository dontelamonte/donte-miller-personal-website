<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Text Style Comparison</title>
<style>
 :root{--bg:#ece3d2;--ink:#243d32;--muted:#5d6a5f;--line:#cdbf9f;--accent:#a74d31}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}
 header{padding:20px 24px 8px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end}
 h1{font:600 22px/1.2 Georgia,serif;margin:0}
 p.note{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:640px}
 .controls{display:flex;flex-wrap:wrap;gap:16px;margin-left:auto}
 .group{display:flex;gap:4px;align-items:center}
 .group span{font-size:12px;color:var(--muted);margin-right:4px}
 .group button{border:1px solid var(--line);background:#f7f0e2;color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
 .group button[aria-pressed=true]{background:var(--ink);color:#f6ead2;border-color:var(--ink)}
 main{display:grid;gap:16px;padding:12px 24px 32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--col)),1fr))}
 figure{margin:0}
 figcaption{font-size:13px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
 figcaption b{font-weight:600}
 figcaption a{color:var(--accent)}
 .frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#d9ccb3}
 .frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
</style>
</head>
<body>
<header>
 <div>
  <h1>Text style comparison</h1>
  <p class="note">The same live room in four text styles. Pick a room and a screen size; each panel is a working copy of the site, so you can scroll and click inside it. Open one full-size with its link.</p>
 </div>
 <div class="controls">
  <div class="group" id="rooms"><span>Room</span>
   <button data-room="living" aria-pressed="true">Home</button>
   <button data-room="table">Table</button>
   <button data-room="workshop">Workshop</button>
   <button data-room="library">Library</button>
  </div>
  <div class="group" id="sizes"><span>Screen</span>
   <button data-size="phone" aria-pressed="true">Phone</button>
   <button data-size="desktop">Desktop</button>
  </div>
 </div>
</header>
<main id="grid"></main>
<script>
 const styles=[
  ['', 'Current site', 'today’s live look'],
  ['glass', 'A · Indigo glass', 'recommended'],
  ['paper', 'B · Paper cards', ''],
  ['glass-scrim', 'A + C · Glass with edge shading', '']
 ];
 const sizes={phone:[390,844],desktop:[1280,800]};
 let room='living',size='phone';
 const grid=document.getElementById('grid');
 function url(style){return '/'+(style?'?text='+style:'')+'#'+room;}
 function render(){
  const [w,h]=sizes[size];
  grid.style.setProperty('--col',size==='phone'?'230px':'480px');
  grid.innerHTML='';
  for(const [style,name,tag] of styles){
   const fig=document.createElement('figure');
   fig.innerHTML=`<figcaption><span><b>${name}</b>${tag?' · '+tag:''}</span><a href="${url(style)}" target="_blank" rel="noopener">Open ↗</a></figcaption><div class="frame"><iframe title="${name}" width="${w}" height="${h}" src="${url(style)}"></iframe></div>`;
   grid.append(fig);
  }
  fit();
 }
 function fit(){
  const [w,h]=sizes[size];
  for(const frame of grid.querySelectorAll('.frame')){
   const scale=frame.clientWidth/w;
   frame.style.height=Math.round(h*scale)+'px';
   frame.querySelector('iframe').style.transform=`scale(${scale})`;
  }
 }
 function bind(id,key,apply){
  document.getElementById(id).addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
   apply(b.dataset[key]);render();
  });
 }
 bind('rooms','room',v=>room=v);
 bind('sizes','size',v=>size=v);
 addEventListener('resize',fit);
 render();
</script>
</body>
</html>
